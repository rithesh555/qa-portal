# nginx for the QA Portal web image (nginx-unprivileged: runs as uid 101 on 8080).
# Serves the Vite build and proxies /api to the API on the same origin, so
# session cookies stay first-party. See docs/devops/stage-01-containers.md.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Imports send up to 12 MiB (the API's import body limit).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API. The API trusts exactly this hop (TRUST_PROXY), so it
    # takes the client IP from the last X-Forwarded-For entry, which nginx
    # writes; anything a browser puts earlier in the header is ignored.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin and Cookie pass through untouched (the API checks Origin).
        proxy_read_timeout 60s;
        # Stream large uploads straight to the API instead of to disk.
        proxy_request_buffering off;
    }

    # Hashed build files never change: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html, which is never cached,
    # so a new release is picked up on the next page load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
