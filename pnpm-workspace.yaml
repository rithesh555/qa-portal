packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# Only listed packages may run install scripts (pnpm supply-chain default).
allowBuilds:
  esbuild: true
  msw: false
  prisma@7.10.1: true
  "@prisma/engines@7.10.1": true
  # Ships its binary as an optional dependency; hooks install via `prepare`.
  lefthook: false

# Dependencies must be at least 2 weeks old before they're resolved (minutes).
minimumReleaseAge: 20160

# Supply-chain guards (Phase 9, Stage 2).
# Transitive dependencies may only come from the registry, never from git
# URLs or tarballs.
blockExoticSubdeps: true
# Fail if a version was published with weaker trust evidence (trusted
# publishing, provenance) than an earlier one: the pattern of a hijacked
# maintainer account.
trustPolicy: no-downgrade
# Versions older than a year (525600 minutes) are exempt: old release lines
# such as semver 6 and undici-types 6 predate provenance.
trustPolicyIgnoreAfter: 525600
trustPolicyExclude:
  # Published by Prisma's usual release bot, like 7.10.0; no recent prisma
  # release carries provenance. Pinned on purpose (see CLAUDE.md).
  - prisma@7.10.1

# Security fixes for transitive packages (Phase 8 review, 2026-10-19).
overrides:
  # Pulled in by prisma 7.10.0 and better-auth; never loaded here (Postgres
  # via @prisma/adapter-pg). 3.24.4 fixes GHSA-3f6p-5ww8-9rcr and
  # GHSA-rgwj-5xj2-c3m3, and is what prisma 7.10.1 ships.
  mysql2: 3.24.4
  # Dependency update, 2026-11-02 (each fix at least 2 weeks old).
  # shadcn CLI (dev only).
  "undici@^7": 7.30.1
  "qs@^6": 6.16.1
  # jsdom (tests only) via vitest.
  "undici@^8": 8.12.2
  # @fastify/rate-limit (API).
  "ip-address@^10": 10.7.4
  # 2026-11-03, fixes published 2026-10-19. fast-uri: URI parsing in
  # fast-json-stringify and @fastify/swagger's schema resolver (API).
  "fast-uri@^3": 3.1.9
  "fast-uri@^4": 4.2.3
  # systeminformation: Windows-only command injection; shadcn CLI only.
  "systeminformation@^5": 5.33.16

auditConfig:
  ignoreGhsas:
    # Reviewed 2026-11-02; review all of these again by 2026-11-16.
    # body-parser 2.3 (DoS on compressed bodies): only in the shadcn CLI's MCP
    # server (dev tool, never runs in the app). Fix 2.4.0 is from 2026-10-22,
    # younger than 2 weeks.
    - GHSA-27r3-jxmh-p828
    # glob 13 / minimatch 10: @fastify/static under @fastify/swagger-ui, which
    # serves the dev-only /api/docs from a fixed folder; no user glob input.
    # Fixes are new majors from 2026-10-27.
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249
    # deepmerge 4.3.1 (prototype poisoning of the result): shadcn CLI only,
    # merges its own registry JSON; no fixed release exists.
    - GHSA-gcqx-w48m-w2h4
    # zod 3.25.76 (memory on oversized constrained collections): shadcn CLI
    # only; no fixed 3.x exists. The app's own zod is 4.6.6 (fixed).
    - GHSA-mrhx-c7xc-m3w5
