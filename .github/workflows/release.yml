# Keeps a release PR open with the next version and CHANGELOG.md, worked out
# from the Conventional Commit titles merged to main. Merging that PR tags
# vX.Y.Z and creates the GitHub release. See docs/devops/stage-00-sdlc.md.
# Then the release's images get their version tags (1.2.3, 1.2, 1): the same
# digests build.yml published and signed for that commit, never a rebuild.
#
# It acts as the repo's own GitHub App (not the workflow's GITHUB_TOKEN):
# GitHub never starts workflows for a PR opened with GITHUB_TOKEN, so the
# release PR would get no CI and could never pass the required checks.
# See docs/devops/stage-03-supply-chain.md.
name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tags
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The app's private key lives in this environment, which only main can use.
    environment: release
    # The workflow token isn't used; the app token below does the writes.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: App token (this repo only, short-lived)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write # tags, releases, CHANGELOG commits
          permission-pull-requests: write # the release PR
          permission-issues: write # release-please's "autorelease" labels
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build once, promote by digest. A version tag is just another name for the
  # image that was already built, scanned, signed and attested on main, so
  # `cosign verify` and `gh attestation verify` work on it unchanged.
  promote:
    name: Version-tag the release images
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read # find and watch the release commit's build run
      packages: write # add the version tags in GHCR
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Wait for the release commit's images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --workflow build.yml --commit "$SHA" --event push --limit 1 --json databaseId -q '.[0].databaseId')
            [ -n "$run_id" ] && break
            sleep 20
          done
          [ -n "$run_id" ] || { echo "::error::No build.yml run for $SHA"; exit 1; }
          gh run watch "$run_id" --exit-status --interval 30 > /dev/null
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # --prefer-index=false copies the manifest as it is, so the digest
      # (and everything signed or attested against it) stays the same.
      - name: Add the version tags
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          version="${TAG_NAME#v}"
          for image in api migrate web; do
            ref="ghcr.io/rithesh555/qa-portal-$image"
            docker buildx imagetools create --prefer-index=false \
              -t "$ref:$version" -t "$ref:$MAJOR.$MINOR" -t "$ref:$MAJOR" \
              "$ref:sha-${SHA::7}"
            echo "- \`$ref:$version\` = \`sha-${SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          done
