# The PR gate. Everything here must pass before a PR can merge; the ruleset
# requires the last job, "CI result". See docs/devops/stage-02-ci.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR replaces the old run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A throwaway Postgres in a service container, reachable only on the runner.
  # trust auth: there's no password to leak.
  PG_URL: postgresql://qa_portal@localhost:5432

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # list the PR's changed files
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Classify the changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > files.txt
          cat files.txt
          # Docs, Markdown and GitHub templates don't need the heavy jobs.
          if grep -qvE '^(docs/|\.github/(ISSUE_TEMPLATE/|CODEOWNERS$|pull_request_template\.md$))|\.md$' files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint-typecheck:
    name: Lint and typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests (shared, web)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @qa/shared test
      - run: pnpm --filter @qa/web test

  api-integration:
    name: API integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: qa_portal
          POSTGRES_DB: qa_portal_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qa_portal -d qa_portal_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generate per-run secrets
        run: |
          value=$(openssl rand -hex 32)
          echo "::add-mask::$value"
          echo "BETTER_AUTH_SECRET=$value" >> "$GITHUB_ENV"
      - name: API tests
        env:
          NODE_ENV: test
          # Never used by the tests (they switch to TEST_DATABASE_URL), but required to be a URL.
          DATABASE_URL: ${{ env.PG_URL }}/qa_portal_unused
          TEST_DATABASE_URL: ${{ env.PG_URL }}/qa_portal_test
          WEB_ORIGIN: http://localhost:5173
          BETTER_AUTH_URL: http://localhost:3000
        run: pnpm --filter @qa/api test

  e2e:
    name: E2E (shard ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: qa_portal
          POSTGRES_DB: qa_portal_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qa_portal -d qa_portal_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://qa_portal@localhost:5432/qa_portal_e2e
      E2E_WORKERS: "4"
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Generate per-run secrets
        run: |
          for name in BETTER_AUTH_SECRET E2E_ADMIN_PASSWORD E2E_USER_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @qa/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @qa/e2e exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @qa/e2e exec playwright install-deps chromium
      - name: Run shard ${{ matrix.shard }}/2
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter @qa/e2e exec playwright test --shard="$SHARD/2"
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 1

  e2e-report:
    name: E2E report
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: e2e/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into one HTML report
        working-directory: e2e
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-html-report-attempt-${{ github.run_attempt }}
          path: e2e/playwright-report
          retention-days: 14

  docker:
    name: Images, scan and stack smoke
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      - name: Lint the shell scripts
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d docker/stack.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build api, migrate and web
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            migrate.cache-from=type=gha,scope=migrate
            migrate.cache-to=type=gha,scope=migrate,mode=max
            web.cache-from=type=gha,scope=web
            web.cache-to=type=gha,scope=web,mode=max
      - name: Check the accepted findings (each needs a statement and an expiry date)
        run: |
          docker run --rm -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
            mikefarah/yq:4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e \
            -e '[.[][] | select((has("statement") and has("expired_at")) | not)] | length == 0' \
            /work/.trivyignore.yaml > /dev/null \
            || { echo "::error file=.trivyignore.yaml::Every entry needs a statement and an expired_at date"; exit 1; }
      - name: Scan the images (fail on fixable HIGH/CRITICAL, or secrets)
        run: |
          for image in api migrate web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore.yaml:/work/.trivyignore.yaml:ro" \
              aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
              image --quiet --scanners vuln,secret --ignore-unfixed \
              --ignorefile /work/.trivyignore.yaml \
              --severity HIGH,CRITICAL --exit-code 1 "qa-portal-$image:local"
          done
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Start the stack
        env:
          STACK_NO_BUILD: "1"
        run: |
          docker/stack.sh init
          docker/stack.sh up
          docker/stack.sh seed-admin
      - name: Smoke checks
        run: docker/stack.sh smoke
      - name: Migrate again (must be a no-op)
        run: |
          docker compose --env-file .env.stack -f docker/compose.stack.yaml run --rm migrate | tee migrate.log
          grep -q "No pending migrations" migrate.log
      - name: Stack logs
        if: failure()
        run: docker compose --env-file .env.stack -f docker/compose.stack.yaml logs --no-color

  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color=false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --format plain .

  # OpenTofu and tflint on infra/ (Stage 4). Static checks only: nothing
  # here talks to a cluster. See docs/devops/stage-04-k8s-platform.md.
  infra:
    name: Infra lint (tofu, tflint)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TOFU_IMAGE: ghcr.io/opentofu/opentofu:1.13.2@sha256:25bdfbe87000b8a88d44c7ef0cca53381da95f6203f7aed1e8cf5b81ecbe18eb
      TFLINT_IMAGE: ghcr.io/terraform-linters/tflint:v0.65.0@sha256:2788f4d4fc663c0e953b011b01bf443fe5bfce7587ee916e588e6057b85d6359
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tofu fmt, init and validate
        shell: bash
        run: |
          tofu() { docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e TF_IN_AUTOMATION=1 -v "$PWD:/repo" -w /repo "$TOFU_IMAGE" "$@"; }
          tofu fmt -check -recursive infra
          # Roots only: each must match its committed lock file, so CI never
          # installs a provider newer than the pin. Modules have no lock file;
          # the platform root validates infra/modules/* through its module
          # calls with the locked providers, and tflint checks them too.
          for dir in infra/local/cluster infra/local/platform; do
            echo "::group::$dir"
            tofu -chdir="$dir" init -backend=false -input=false -lockfile=readonly > /dev/null
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done
      - name: tflint
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/data" "$TFLINT_IMAGE" --chdir=infra --recursive --config=/data/infra/.tflint.hcl --format=compact
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d infra/local/cluster.sh

  # The one required check. Passes when every job passed or was skipped
  # (a docs-only PR skips the heavy jobs); fails on any failure or cancel.
  result:
    name: CI result
    needs:
      [
        changes,
        lint-typecheck,
        unit,
        api-integration,
        e2e,
        e2e-report,
        docker,
        workflow-lint,
        infra,
      ]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
