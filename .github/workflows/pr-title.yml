# PRs are squash-merged with the PR title as the commit message, so the title
# must be a Conventional Commit (the same types as commitlint.config.js).
# release-please reads these titles to pick the next version.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # read the PR title
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          requireScope: false
          # Sentence case is allowed ("feat: Phase 9 …"); only the type is strict.
          subjectPattern: ^.+$
