# Publishes the three images for every commit on main: pushed to GHCR,
# signed with cosign (keyless), with an SBOM and SLSA build provenance
# attached as attestations. Pull requests never publish; ci.yml builds and
# scans their images without pushing. See docs/devops/stage-03-supply-chain.md.
#
# Tags: sha-<7> (immutable, one per commit) and main (moves to the newest
# commit). release.yml adds the version tags to the same digests.
name: Build and publish

on:
  push:
    branches: [main]

permissions: {}

# No concurrency group: every commit gets its own images, and runs for
# different commits don't block each other. Only the "main" tag is shared,
# and the last step moves it only while its commit is still main's head.

env:
  IMAGE_PREFIX: ghcr.io/rithesh555/qa-portal-

jobs:
  image:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
      packages: write # push the image to GHCR
      id-token: write # the OIDC token that keyless signing and attestations are bound to
      attestations: write # store the provenance and SBOM attestations
      artifact-metadata: write # the storage record linking the image to this repo
    strategy:
      fail-fast: false
      matrix:
        image: [api, migrate, web]
    env:
      IMAGE: ghcr.io/rithesh555/qa-portal-${{ matrix.image }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Commit details
        id: commit
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # BuildKit's own provenance and SBOM are off: the attestations below are
      # the single source, and the image stays a plain single-platform manifest.
      - name: Build and push
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.image }}
          push: true
          provenance: false
          sbom: false
          vars: |
            IMAGE_PREFIX=${{ env.IMAGE_PREFIX }}
            TAGS=sha-${{ steps.commit.outputs.short }}
            VERSION=sha-${{ steps.commit.outputs.short }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.commit.outputs.created }}
          set: |
            ${{ matrix.image }}.cache-from=type=gha,scope=${{ matrix.image }}
            ${{ matrix.image }}.cache-to=type=gha,scope=${{ matrix.image }},mode=max
      - name: Image digest
        id: digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          TARGET: ${{ matrix.image }}
        run: |
          digest=$(jq -r --arg t "$TARGET" '.[$t]["containerimage.digest"]' <<< "$METADATA")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::No digest in the bake metadata"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Keyless: no key to store or leak. Sigstore's Fulcio issues a
      # 10-minute certificate for this workflow's OIDC identity, and the
      # signature is logged in the public Rekor transparency log.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: SBOM (Syft, SPDX JSON)
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          docker run --rm \
            -v "$HOME/.docker/config.json:/config/config.json:ro" -e DOCKER_CONFIG=/config \
            anchore/syft:v1.54.1@sha256:3eb5379ba7b409c3f4069b686110527af0c47df993fa5c10d13e7cf34f49b1aa \
            "registry:$IMAGE@$DIGEST" -o spdx-json > sbom.spdx.json
          jq -e '.packages | length > 0' sbom.spdx.json > /dev/null
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Attest build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom.spdx.json
          retention-days: 30

      # "main" is a moving tag. A slower run for an older commit must not
      # move it back, so check that this commit is still main's head.
      - name: Move the main tag
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          head=$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is now at ${head::7}; leaving its tag to that run."
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:main" "$IMAGE@$DIGEST"
      - name: Summary
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          SHORT: ${{ steps.commit.outputs.short }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "- Digest: \`$DIGEST\`"
            echo "- Tags: \`sha-$SHORT\` (and \`main\` if this commit is still main's head)"
            echo
            echo "Verify:"
            echo
            echo '```bash'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/build.yml@refs/heads/main \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
