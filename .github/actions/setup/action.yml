# Shared job setup: pnpm (version from package.json "packageManager"),
# Node, the pnpm store cache and a frozen install. Each job checks out the
# repo first, because a local action lives inside it.
name: Set up Node and pnpm
description: Install pnpm, Node and the workspace dependencies

inputs:
  node-version:
    description: Exact Node version (at least 14 days old; same as the Docker base image)
    default: "22.23.3"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      # LEFTHOOK=0: the root `prepare` script would install git hooks, which CI doesn't use.
      env:
        LEFTHOOK: "0"
      run: pnpm install --frozen-lockfile
