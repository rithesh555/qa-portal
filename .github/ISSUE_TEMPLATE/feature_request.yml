name: Feature request
description: Suggest a change or a new capability
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who is affected and what gets in their way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: roles
    attributes:
      label: Who needs it
      multiple: true
      options:
        - Admin
        - QA Lead
        - Tester
        - Viewer
        - Operators (deployment, monitoring)
