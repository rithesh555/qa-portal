# Values for the cloudnative-pg operator chart (version pinned in
# deploy/argocd/platform/templates/cloudnative-pg.yaml).
# Image pinned by digest; the tag is the chart's appVersion.

image:
  repository: ghcr.io/cloudnative-pg/cloudnative-pg
  tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07

resources:
  requests: { cpu: 25m, memory: 96Mi }
  limits: { memory: 256Mi }

# No PodMonitor or Grafana dashboard on the core profile (Stage 7).
monitoring:
  podMonitorEnabled: false
  grafanaDashboard:
    create: false
