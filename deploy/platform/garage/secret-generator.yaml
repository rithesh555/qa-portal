# KSOPS: decrypts credentials.sops.yaml at build time (in the Argo CD repo
# server, with the age key from infra/local/secret-zero.sh).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: garage-credentials
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./credentials.sops.yaml
