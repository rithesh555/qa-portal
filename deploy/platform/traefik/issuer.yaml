# Signs with the local root CA from infra/local/secret-zero.sh (Secret
# "local-ca" in this namespace, never in git). The CA is name-constrained to
# qa.localtest.me, and this Issuer is namespaced: only kube-system can ask
# it for certificates, unlike a ClusterIssuer that every namespace can use.
# Until the Secret exists the Issuer reports NotReady and the certificate
# waits.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-ca
  namespace: kube-system
spec:
  ca:
    secretName: local-ca
