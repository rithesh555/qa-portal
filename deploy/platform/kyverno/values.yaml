# Values for the kyverno chart (version pinned in
# deploy/argocd/platform/templates/kyverno.yaml).
# Only the admission controller: it evaluates policies when objects are
# created or changed. Background scans, cleanup and policy reports are off
# to save about 300 MiB; turn reportsController on if audit reports are
# needed. Images from GHCR (the same images reg.kyverno.io serves), pinned
# by digest; the tag is the chart's appVersion.

admissionController:
  replicas: 1
  initContainer:
    image:
      registry: ghcr.io
      repository: kyverno/kyvernopre
      tag: v1.19.2@sha256:27f3cc52e628559b56d08363b85316819802086c9808606914f7805a244148f4
  container:
    image:
      registry: ghcr.io
      repository: kyverno/kyverno
      tag: v1.19.2@sha256:c8c4dd09e720d2cd7fd24ca73ac28e46651001372f988e0cba3f2f612f04b955
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }

backgroundController:
  enabled: false
cleanupController:
  enabled: false
reportsController:
  enabled: false

# Post-upgrade Job that migrates stored objects to new CRD versions.
crds:
  migration:
    image:
      registry: ghcr.io
      repository: kyverno/kyverno-cli
      tag: v1.19.2@sha256:322ec5044d600930cb3af0e56dc33154a2d1d1fba58f4cadad3f47be7e78b11c

# Pre-delete Job that removes Kyverno's webhooks, so an uninstall can't
# leave a webhook that blocks every API call.
webhooksCleanup:
  image:
    registry: ghcr.io
    repository: kyverno/readiness-checker
    tag: v1.19.2@sha256:02600428e7c956e222f4376413525866ed9fec28e6bcb1222774ce6bf5fc904a

# `helm test` pod (the chart's default tag is "latest").
test:
  image:
    registry: ghcr.io
    repository: kyverno/readiness-checker
    tag: v1.19.2@sha256:02600428e7c956e222f4376413525866ed9fec28e6bcb1222774ce6bf5fc904a
