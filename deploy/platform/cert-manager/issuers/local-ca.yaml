# Signs certificates with the mkcert root CA that Windows already trusts, so
# https://*.qa.localtest.me shows a valid padlock without browser warnings.
#
# The Secret "local-ca" (tls.crt, tls.key) is not in git: the CA key never
# leaves the laptop except into this one Secret, which
# infra/local/secret-zero.sh creates. Until it exists the issuer reports
# NotReady, and certificates wait for it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca
spec:
  ca:
    secretName: local-ca
