# Values for the cert-manager chart (version pinned in
# deploy/argocd/platform/templates/cert-manager.yaml).
# Every image is pinned by digest (tag@digest; the tag is the chart's
# appVersion). Renovate moves the chart and these pins in one PR.

global:
  leaderElection:
    # Leader-election leases (and the Roles for them) in cert-manager's own
    # namespace, not the chart's default kube-system: the add-ons' AppProject
    # has no access to kube-system.
    namespace: cert-manager

crds:
  enabled: true
  # Deleting the Application must never delete every Certificate with it.
  keep: true

image:
  repository: quay.io/jetstack/cert-manager-controller
  tag: v1.21.3@sha256:9f4f96a33c7774cef24466fcd85031997531a03a8d117f151126baa8d1290dcc
resources:
  requests: { cpu: 10m, memory: 48Mi }
  limits: { memory: 128Mi }

webhook:
  image:
    repository: quay.io/jetstack/cert-manager-webhook
    tag: v1.21.3@sha256:055ac8e9de6a0ba6763794838fe38944acc650f68ebe1b01dd8be079e580f458
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

cainjector:
  image:
    repository: quay.io/jetstack/cert-manager-cainjector
    tag: v1.21.3@sha256:083d0e906f8eb44e255fe4ff817ae54e49f9ed82e22f1011bb4e9e4f4b8a641f
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

# A post-install Job that waits until the webhook answers. Argo CD runs it as
# a hook, so the app turns Healthy only when cert-manager really works.
startupapicheck:
  image:
    repository: quay.io/jetstack/cert-manager-startupapicheck
    tag: v1.21.3@sha256:1c519d4afca1413d1e4ccd78bdc756184418ab55a34569a3b3de39d32f9974e1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

# No Prometheus on the core profile (Stage 7 brings observability).
prometheus:
  enabled: false
