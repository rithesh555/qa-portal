# Traefik ships with k3s. This app only configures it: it turns on the
# Gateway API provider and gives the gateway its TLS certificate, signed by
# the local CA through a namespaced Issuer. It must not create or relabel
# kube-system (no CreateNamespace, no namespace metadata), and its own
# AppProject ("gateway") lets it create only those three kinds there.
# Wave 1: needs cert-manager's CRDs and webhook.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: "{{ .Values.repoURL }}"
    targetRevision: "{{ .Values.revision }}"
    path: deploy/platform/traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
