# CloudNativePG: the operator that runs Postgres for the app (Stage 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  sources:
    - repoURL: ghcr.io/cloudnative-pg/charts
      chart: cloudnative-pg
      targetRevision: 0.29.1
      helm:
        releaseName: cnpg
        valueFiles:
          - $values/deploy/platform/cloudnative-pg/values.yaml
    - ref: values
      repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.revision }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: platform
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.36
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.36
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
---
# Barman Cloud plugin: continuous backups (base backups and WAL) of each
# Postgres cluster to S3 (Garage here). It must run in the operator's
# namespace. Wave 2: needs the operator's CRDs and cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-barman-cloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  sources:
    - repoURL: ghcr.io/cloudnative-pg/charts
      chart: plugin-barman-cloud
      targetRevision: 0.8.1
      helm:
        releaseName: barman-cloud
        valueFiles:
          - $values/deploy/platform/cloudnative-pg/barman-cloud-values.yaml
    - ref: values
      repoURL: "{{ .Values.repoURL }}"
      targetRevision: "{{ .Values.revision }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/part-of: platform
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: v1.36
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.36
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
