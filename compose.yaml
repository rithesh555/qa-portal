# Local PostgreSQL for development only. The containerised app stack is
# docker/compose.stack.yaml (docker/stack.sh).
name: qa-portal

services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?set in .env}
      POSTGRES_E2E_DB: ${POSTGRES_E2E_DB:-qa_portal_e2e}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images keep their data in /var/lib/postgresql/18/docker, so
      # the volume is mounted one level up (docker-library/postgres#1259). A new
      # volume name keeps the old Postgres 17 volume untouched for the upgrade
      # (README: "Upgrading the database to Postgres 18").
      - pgdata18:/var/lib/postgresql
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata18:
